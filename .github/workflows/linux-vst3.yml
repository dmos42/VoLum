name: Linux VST3

# The Linux port of the plug-in (NeuralAmpModeler/linux). CI.yml already builds the NAM
# core on ubuntu, but nothing there produces a loadable VoLum.vst3, so a broken platform
# layer goes unnoticed. This job builds the VST3 bundle and runs it through the headless
# probe host (audio graph + editor window on Xvfb) - the closest thing to "a DAW loaded
# it" that is possible without a desktop session.
#
# Deliberately not triggered by dev/main yet: the port is on its own branch until upstream
# decides what to do with it (guitarlum/VoLum#17).

on:
  workflow_dispatch:
  push:
    branches:
      - volum/linux-port
      - linux/**
  pull_request:
    branches:
      - volum/linux-port
      - dev
      - main

concurrency:
  group: linux-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux_vst3:
    name: Linux VST3 (build + headless probe)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Download the VST3 SDK
        # Not a submodule: iPlug 2 tracks it as a directory, so the SDK has to be fetched
        # (same step the Windows and macOS jobs do through their project files). The script
        # clones into $PWD/VST3_SDK and finishes with `git checkout README.md`, so it has to
        # run from the folder that holds it - from the repo root it drops the SDK at the
        # wrong path and then fails with "pathspec 'README.md' did not match".
        working-directory: iPlug2/Dependencies/IPlug
        run: bash download-vst3-sdk.sh
        shell: bash

      - name: Download the CLAP headers
        # Headers only (issue #9): the CLAP wrapper speaks the format's C API and
        # drives the VST3 module, so nothing else from the SDK is needed.
        run: bash NeuralAmpModeler/linux/download-clap.sh
        shell: bash

      - name: Install X11 and OpenGL development files
        # glib2 is what the plug-in uses to ask the desktop for its dialogs; dbus and
        # python3-gi are what let the scripted portal answer instead of a person.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libx11-dev libgl1-mesa-dev libglu1-mesa-dev libatomic1 libasound2-dev \
            libglib2.0-dev dbus dbus-daemon dbus-bin python3-gi gir1.2-glib-2.0 desktop-file-utils \
            appstream fonts-dejavu-core lv2-dev
        shell: bash

      - name: Configure
        # The bundled rigs are 249 .nam files (~77 MB) and are not needed to prove the
        # plug-in loads and processes sound, so the CI bundle is built without them.
        run: |
          cmake -S NeuralAmpModeler/linux -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVOLUM_COPY_RIGS=OFF
        shell: bash

      - name: Build
        run: cmake --build build/linux
        shell: bash

      - name: Check the plug-in asks the desktop for its dialogs
        # A runner cannot click a file chooser, but it can say whether the portal client
        # is even in the module: with it, the module links GLib's D-Bus. Without it the
        # pickers are stubs, the run stays green, and only the log knows.
        run: |
          ldd build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so | grep -q 'libgio-2\.0' \
            || { echo "le module ne lie pas libgio : glib2-devel (libglib2.0-dev) manquait au configure, les boites de dialogue sont absentes"; exit 1; }
        shell: bash

      - name: Ask a scripted desktop for its dialogs
        # test/fake-portal.py takes the portal name on a throwaway session bus and
        # refuses any request it cannot decode, so what is checked here is the shape of
        # the requests the plug-in sends: filters, folder and name hints, the token, and
        # what comes back. The script says "test ignore" when its own fixture is
        # missing, which is why the step insists on seeing the summary line.
        run: |
          out="$(NeuralAmpModeler/linux/test/portal-test.bash build/linux 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'controles, aucun clic' \
            || { echo "le test du portail n'a rien verifie : il lui faut dbus et python3-gi"; exit 1; }
        shell: bash

      - name: Import a rig through the sidebar, with nobody clicking
        # The last inch of issue #1 (test/rig-import-test.bash): the probe's --click
        # presses the PLAY->BUILD toggle (the sidebar only lives in BUILD), the
        # sidebar's custom-amp "+", the builder's "Add .nam files" and "Save amp",
        # and the scripted portal answers with a real capture. What is
        # proven is the journey, not just the dialog: the capture lands in the user's
        # content folder, the amp shows up in the sidebar without a restart, and a
        # cancelled picker changes nothing. The button rects are read from the plug-in
        # itself (VOLUM_TEST_DUMP), so the test does not carry pixels that a layout
        # change would stale.
        run: |
          out="$(NeuralAmpModeler/linux/test/rig-import-test.bash build/linux 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'sans redemarrage' \
            || { echo "le test d'import n'a rien verifie : il lui faut xvfb-run, dbus et python3-gi"; exit 1; }
        shell: bash

      - name: Check the in-app message box answers
        # The box the platform draws itself (issue #2): its own editor window on Xvfb,
        # a ShowMessageBox that must not answer inline, a press off the buttons that
        # must not dismiss it, and OK/Yes/No answered through the completion handler.
        # The button rects come from the platform, so no font metric is duplicated.
        run: |
          out="$(xvfb-run -a build/linux/volum-msgbox-check 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'boite de message conforme' \
            || { echo "le check n'a rien verifie : il lui faut un serveur X"; exit 1; }
        shell: bash

      - name: Check the standalone's audio settings panel
        # The panel the standalone draws over its own editor (issue #10): rows for the
        # output, the input and the period, choices written to app.conf atomically, a
        # device that refuses to open answered in-app with nothing written. The same run
        # then hands a conf in the panel's own shape (including the no-in key) to
        # volum-app --check: what the panel writes is exactly what the host re-reads.
        run: |
          out="$(xvfb-run -a build/linux/volum-panel-check 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'panneau audio conforme' \
            || { echo "le check n'a rien verifie : il lui faut un serveur X"; exit 1; }
          conf="$(mktemp -d)/app.conf"
          printf 'out=null\nno-in=\nperiod=128\n' > "$conf"
          out="$(build/linux/volum-app --no-ui --check --config "$conf" 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'tout est negocie' \
            || { echo "volum-app n'a pas accepte le conf ecrit par le panneau"; exit 1; }
        shell: bash

      - name: Check the standalone's MIDI port
        # The ALSA seq port the standalone opens (issue #11): a sender connects to
        # it in the same process, and note on/off, CC, program change and pitch
        # bend come back as the exact bytes a cable would carry, stamped inside
        # the block; clock and queue bytes are dropped; a silent drain does not
        # block. Exit code 3 means the runner has no seq driver - a machine
        # without MIDI, not a broken port - so it is a warning, not a failure.
        run: |
          code=0
          out="$(build/linux/volum-midi-check 2>&1)" || code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 3 ]; then
            echo "pas de pilote seq sur le runner : check ignore"
          else
            [ "$code" -eq 0 ] || exit "$code"
            printf '%s\n' "$out" | grep -q 'port alsa conforme' \
              || { echo "le check du port MIDI n'a rien verifie"; exit 1; }
          fi
        shell: bash

      - name: Stage a system installation
        # What an RPM, a tarball and an AppImage are all built on: the same install
        # rules, staged into a build root. Checked here rather than at release time,
        # because an install rule aimed at a target that has not been created yet
        # installs nothing and says nothing while doing it - which is what this did the
        # first time, until the rules were moved below the host section.
        #
        # The three names of the application - the AppStream id, the .desktop file beside
        # it, the icon that `Icon=` points at - are checked against each other rather than
        # each on its own: a package that installs `volum.desktop` and an icon named
        # something else looks fine and shows nothing in a menu or a software centre, and
        # the only thing that notices is whatever reads the metadata.
        run: |
          rm -rf /tmp/stage
          DESTDIR=/tmp/stage cmake --install build/linux --prefix /usr
          test -x /tmp/stage/usr/bin/volum-app
          test -s /tmp/stage/usr/share/applications/com.github.guitarlum.VoLum.desktop
          test -s /tmp/stage/usr/share/icons/hicolor/256x256/apps/com.github.guitarlum.VoLum.png
          test -s /tmp/stage/usr/share/icons/hicolor/48x48/apps/com.github.guitarlum.VoLum.png
          test -s /tmp/stage/usr/share/metainfo/com.github.guitarlum.VoLum.metainfo.xml
          find /tmp/stage -name 'VoLum.vst3.so' | grep -q .
          test -L "$(find /tmp/stage -name 'VoLum.so' -type l | head -1)"
          desktop-file-validate /tmp/stage/usr/share/applications/com.github.guitarlum.VoLum.desktop
          appstreamcli validate-tree /tmp/stage | tail -3
          grep -q 'com.github.guitarlum.VoLum' /tmp/stage/usr/share/metainfo/com.github.guitarlum.VoLum.metainfo.xml
        shell: bash

      - name: Probe the audio path
        run: |
          ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so --seconds 2
        shell: bash

      - name: Check the LV2 and CLAP wrappers render the VST3's audio
        # Issue #9 end to end: one tone through the direct engine, the LV2 module
        # and the CLAP module, and the same bytes out of all three, defaults and
        # with a parameter moved. Without the rigs the plug-in's fallback is
        # silence, so the run also proves the surfaces agree while mute - the
        # check says so instead of failing on a parameter it cannot hear.
        run: |
          ./build/linux/volum-wrapper-check \
            build/linux/VoLum.lv2/volum-lv2.so build/linux/VoLum.clap
        shell: bash

      - name: Probe the editor window on Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui --seconds 1 --uiseconds 3
        shell: bash

      - name: Resize the editor the way a DAW does
        # Opening the editor proves less than it looks like: a host sizes the view inside its
        # own container, so the plug-in only ever gets a ConfigureNotify for a window whose
        # size it does not own. Carla took a SIGSEGV on the first such size - the resize
        # reached the graphics backend between two frames, where the GLX context had already
        # been released, so the framebuffer came back null and EndFrame() dereferenced it.
        # A 1x1 is what a tiling compositor hands out, and going back up is the other half of
        # a user's drag. Exit code 7 names the step that lost the editor.
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui-only --ui --uiseconds 6 \
            --resize 1:900x700 --resize 2:640x480 --resize 3:1100x850 \
            --resize 4:1x1 --resize 5:900x700
        shell: bash

      - name: Check the plug-in reacts to MIDI
        # The recall path end to end (issue #11): a controller sends CC #102, the
        # probe hands it to the plug-in the way a DAW would (the block's event
        # list), the plug-in decodes it to a recall and answers in its diagnostic
        # log once the idle timer runs it - either "recall slot=" or "has no
        # playable Sound; ignored", both of which prove the path was walked.
        run: |
          xdg="$(mktemp -d)"
          export XDG_CONFIG_HOME="$xdg"
          out="$(xvfb-run -a ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui --seconds 1 --uiseconds 4 --midi 0.5:B0:66:07 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          grep -q '\[midi\]' "$xdg/VoLum/volum.log" \
            || { echo "le plug-in n'a rien repondu au recall CC 102 : chemin MIDI casse"; exit 1; }
        shell: bash

      - name: Run the live host over a file
        # With a WAV in and a WAV out and no --out, volum-live never opens a sound card,
        # so this covers the ALSA front-end, the WAV reader and the processing chain on a
        # runner that has no audio device. A silent output makes the host exit 6. The
        # module has to be named: the default path is the installed bundle under ~/.vst3,
        # which a runner does not have.
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('/tmp/ci-tone.wav', 'wb') as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(48000)
              frames = bytearray()
              for i in range(48000):
                  value = int(12000 * math.sin(2 * math.pi * 220 * i / 48000))
                  frames += struct.pack('<hh', value, value)
              wav.writeframes(bytes(frames))
          PY
          test -x ./build/linux/volum-live || { echo "volum-live absent : alsa-lib n'a pas ete trouve au configure"; exit 1; }
          ./build/linux/volum-live \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-out.wav --meter 0 --no-ui
          test -s /tmp/ci-out.wav
        shell: bash

      - name: Run the standalone host
        # volum-app is the same engine as volum-live behind a window, so the interesting
        # thing to test is the part that is only in the standalone: it is launched with no
        # module argument and has to find build/linux/VoLum.vst3 from /proc/self/exe, the
        # way it will on a machine where VoLum was installed and not built. Headless here,
        # so its output can be compared byte for byte with what volum-live made of the same
        # tone two steps up: one engine, two hosts.
        run: |
          test -x ./build/linux/volum-app || { echo "volum-app absent : alsa-lib n'a pas ete trouve au configure"; exit 1; }
          ./build/linux/volum-app \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-app.wav --meter 0 --no-ui
          test -s /tmp/ci-app.wav
          # What the plug-in stages (the amp model, the calibration) lands through a
          # 20 ms idle timer paced in wall time, while the offline loop paces blocks
          # against the audio clock: the block where a staged change takes over can
          # fall one block earlier in one host than in the other, and which one it
          # is changes from run to run and machine to machine - the same runner
          # jitter the editor step below already documents. Once both runs have
          # settled there is nothing left to disagree about, so the byte-for-byte
          # claim is made on the audio from 0.5 s in, with lengths and headers
          # checked whole.
          python3 - <<'PY'
          a = open('/tmp/ci-out.wav', 'rb').read()
          b = open('/tmp/ci-app.wav', 'rb').read()
          assert len(a) == len(b), "les deux hotes n'ecrivent pas la meme longueur"
          assert a[:44] == b[:44], "les en-tetes WAV different"
          start = 44 + 24000 * 4
          assert a[start:] == b[start:], "les deux hotes divergent sur l'audio etabli"
          print("un moteur, deux hotes : sortie identique")
          PY
        shell: bash

      - name: Open the standalone window
        # Closing this window is how the program is meant to end, so the run is left without
        # --no-ui under Xvfb and the host has to report the plug-in's window as embedded.
        # Its audio is deliberately not compared with the headless runs: on this runner an
        # editor attached to the plug-in changes something audible part way through, and
        # does so differently from one machine to the next. That is a plug-in question for
        # issue #3 (noted there), not something the host comparison should lean on.
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-app \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-app-ui.wav --meter 0 \
            | tee /tmp/ci-app-ui.log
          grep -q 'XEmbed confirme' /tmp/ci-app-ui.log
          test -s /tmp/ci-app-ui.wav
        shell: bash

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-linux-vst3
          path: build/linux/VoLum.vst3
          if-no-files-found: error
          retention-days: 14
