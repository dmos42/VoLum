name: Linux VST3

# The Linux port of the plug-in (NeuralAmpModeler/linux). CI.yml already builds the NAM
# core on ubuntu, but nothing there produces a loadable VoLum.vst3, so a broken platform
# layer goes unnoticed. This job builds the VST3 bundle and runs it through the headless
# probe host (audio graph + editor window on Xvfb) - the closest thing to "a DAW loaded
# it" that is possible without a desktop session.
#
# Deliberately not triggered by dev/main yet: the port is on its own branch until upstream
# decides what to do with it (guitarlum/VoLum#17).

on:
  workflow_dispatch:
  push:
    branches:
      - volum/linux-port
      - linux/**
  pull_request:
    branches:
      - volum/linux-port
      - dev
      - main

concurrency:
  group: linux-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux_vst3:
    name: Linux VST3 (build + headless probe)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Download the VST3 SDK
        # Not a submodule: iPlug 2 tracks it as a directory, so the SDK has to be fetched
        # (same step the Windows and macOS jobs do through their project files). The script
        # clones into $PWD/VST3_SDK and finishes with `git checkout README.md`, so it has to
        # run from the folder that holds it - from the repo root it drops the SDK at the
        # wrong path and then fails with "pathspec 'README.md' did not match".
        working-directory: iPlug2/Dependencies/IPlug
        run: bash download-vst3-sdk.sh
        shell: bash

      - name: Install X11 and OpenGL development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libx11-dev libgl1-mesa-dev libglu1-mesa-dev libatomic1 libasound2-dev
        shell: bash

      - name: Configure
        # The bundled rigs are 249 .nam files (~77 MB) and are not needed to prove the
        # plug-in loads and processes sound, so the CI bundle is built without them.
        run: |
          cmake -S NeuralAmpModeler/linux -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVOLUM_COPY_RIGS=OFF
        shell: bash

      - name: Build
        run: cmake --build build/linux
        shell: bash

      - name: Probe the audio path
        run: |
          ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so --seconds 2
        shell: bash

      - name: Probe the editor window on Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui --seconds 1 --uiseconds 3
        shell: bash

      - name: Run the live host over a file
        # With a WAV in and a WAV out and no --out, volum-live never opens a sound card,
        # so this covers the ALSA front-end, the WAV reader and the processing chain on a
        # runner that has no audio device. A silent output makes the host exit 6.
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('/tmp/ci-tone.wav', 'wb') as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(48000)
              frames = bytearray()
              for i in range(48000):
                  value = int(12000 * math.sin(2 * math.pi * 220 * i / 48000))
                  frames += struct.pack('<hh', value, value)
              wav.writeframes(bytes(frames))
          PY
          ./build/linux/volum-live --in-file /tmp/ci-tone.wav --out-file /tmp/ci-out.wav --meter 0 --no-ui
          test -s /tmp/ci-out.wav
        shell: bash

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-linux-vst3
          path: build/linux/VoLum.vst3
          if-no-files-found: error
          retention-days: 14
