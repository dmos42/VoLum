name: Linux VST3

# The Linux port of the plug-in (NeuralAmpModeler/linux). CI.yml already builds the NAM
# core on ubuntu, but nothing there produces a loadable VoLum.vst3, so a broken platform
# layer goes unnoticed. This job builds the VST3 bundle and runs it through the headless
# probe host (audio graph + editor window on Xvfb) - the closest thing to "a DAW loaded
# it" that is possible without a desktop session.
#
# Deliberately not triggered by dev/main yet: the port is on its own branch until upstream
# decides what to do with it (guitarlum/VoLum#17).

on:
  workflow_dispatch:
  push:
    branches:
      - volum/linux-port
      - linux/**
  pull_request:
    branches:
      - volum/linux-port
      - dev
      - main

concurrency:
  group: linux-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux_vst3:
    name: Linux VST3 (build + headless probe)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Download the VST3 SDK
        # Not a submodule: iPlug 2 tracks it as a directory, so the SDK has to be fetched
        # (same step the Windows and macOS jobs do through their project files). The script
        # clones into $PWD/VST3_SDK and finishes with `git checkout README.md`, so it has to
        # run from the folder that holds it - from the repo root it drops the SDK at the
        # wrong path and then fails with "pathspec 'README.md' did not match".
        working-directory: iPlug2/Dependencies/IPlug
        run: bash download-vst3-sdk.sh
        shell: bash

      - name: Install X11 and OpenGL development files
        # glib2 is what the plug-in uses to ask the desktop for its dialogs; dbus and
        # python3-gi are what let the scripted portal answer instead of a person.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libx11-dev libgl1-mesa-dev libglu1-mesa-dev libatomic1 libasound2-dev \
            libglib2.0-dev dbus dbus-daemon dbus-bin python3-gi gir1.2-glib-2.0
        shell: bash

      - name: Configure
        # The bundled rigs are 249 .nam files (~77 MB) and are not needed to prove the
        # plug-in loads and processes sound, so the CI bundle is built without them.
        run: |
          cmake -S NeuralAmpModeler/linux -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVOLUM_COPY_RIGS=OFF
        shell: bash

      - name: Build
        run: cmake --build build/linux
        shell: bash

      - name: Check the plug-in asks the desktop for its dialogs
        # A runner cannot click a file chooser, but it can say whether the portal client
        # is even in the module: with it, the module links GLib's D-Bus. Without it the
        # pickers are stubs, the run stays green, and only the log knows.
        run: |
          ldd build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so | grep -q 'libgio-2\.0' \
            || { echo "le module ne lie pas libgio : glib2-devel (libglib2.0-dev) manquait au configure, les boites de dialogue sont absentes"; exit 1; }
        shell: bash

      - name: Ask a scripted desktop for its dialogs
        # test/fake-portal.py takes the portal name on a throwaway session bus and
        # refuses any request it cannot decode, so what is checked here is the shape of
        # the requests the plug-in sends: filters, folder and name hints, the token, and
        # what comes back. The script says "test ignore" when its own fixture is
        # missing, which is why the step insists on seeing the summary line.
        run: |
          out="$(NeuralAmpModeler/linux/test/portal-test.bash build/linux 2>&1)"
          code=$?
          printf '%s\n' "$out"
          [ "$code" -eq 0 ] || exit "$code"
          printf '%s\n' "$out" | grep -q 'controles, aucun clic' \
            || { echo "le test du portail n'a rien verifie : il lui faut dbus et python3-gi"; exit 1; }
        shell: bash

      - name: Probe the audio path
        run: |
          ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so --seconds 2
        shell: bash

      - name: Probe the editor window on Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui --seconds 1 --uiseconds 3
        shell: bash

      - name: Resize the editor the way a DAW does
        # Opening the editor proves less than it looks like: a host sizes the view inside its
        # own container, so the plug-in only ever gets a ConfigureNotify for a window whose
        # size it does not own. Carla took a SIGSEGV on the first such size - the resize
        # reached the graphics backend between two frames, where the GLX context had already
        # been released, so the framebuffer came back null and EndFrame() dereferenced it.
        # A 1x1 is what a tiling compositor hands out, and going back up is the other half of
        # a user's drag. Exit code 7 names the step that lost the editor.
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-vst3-probe \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --ui-only --ui --uiseconds 6 \
            --resize 1:900x700 --resize 2:640x480 --resize 3:1100x850 \
            --resize 4:1x1 --resize 5:900x700
        shell: bash

      - name: Run the live host over a file
        # With a WAV in and a WAV out and no --out, volum-live never opens a sound card,
        # so this covers the ALSA front-end, the WAV reader and the processing chain on a
        # runner that has no audio device. A silent output makes the host exit 6. The
        # module has to be named: the default path is the installed bundle under ~/.vst3,
        # which a runner does not have.
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('/tmp/ci-tone.wav', 'wb') as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(48000)
              frames = bytearray()
              for i in range(48000):
                  value = int(12000 * math.sin(2 * math.pi * 220 * i / 48000))
                  frames += struct.pack('<hh', value, value)
              wav.writeframes(bytes(frames))
          PY
          test -x ./build/linux/volum-live || { echo "volum-live absent : alsa-lib n'a pas ete trouve au configure"; exit 1; }
          ./build/linux/volum-live \
            build/linux/VoLum.vst3/Contents/x86_64-linux/VoLum.vst3.so \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-out.wav --meter 0 --no-ui
          test -s /tmp/ci-out.wav
        shell: bash

      - name: Run the standalone host
        # volum-app is the same engine as volum-live behind a window, so the interesting
        # thing to test is the part that is only in the standalone: it is launched with no
        # module argument and has to find build/linux/VoLum.vst3 from /proc/self/exe, the
        # way it will on a machine where VoLum was installed and not built. Headless here,
        # so its output can be compared byte for byte with what volum-live made of the same
        # tone two steps up: one engine, two hosts.
        run: |
          test -x ./build/linux/volum-app || { echo "volum-app absent : alsa-lib n'a pas ete trouve au configure"; exit 1; }
          ./build/linux/volum-app \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-app.wav --meter 0 --no-ui
          test -s /tmp/ci-app.wav
          cmp /tmp/ci-out.wav /tmp/ci-app.wav
        shell: bash

      - name: Open the standalone window
        # Closing this window is how the program is meant to end, so the run is left without
        # --no-ui under Xvfb and the host has to report the plug-in's window as embedded.
        # Its audio is deliberately not compared with the headless runs: on this runner an
        # editor attached to the plug-in changes something audible part way through, and
        # does so differently from one machine to the next. That is a plug-in question for
        # issue #3 (noted there), not something the host comparison should lean on.
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1440x900x24" \
            ./build/linux/volum-app \
            --in-file /tmp/ci-tone.wav --out-file /tmp/ci-app-ui.wav --meter 0 \
            | tee /tmp/ci-app-ui.log
          grep -q 'XEmbed confirme' /tmp/ci-app-ui.log
          test -s /tmp/ci-app-ui.wav
        shell: bash

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-linux-vst3
          path: build/linux/VoLum.vst3
          if-no-files-found: error
          retention-days: 14
