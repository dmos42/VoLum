name: Linux debug

# One-off diagnosis harness, repurposed as a soak test: the rig-import test used
# to abort intermittently in the plain Release build (glibc heap corruption at
# editor teardown), and never under ASan or gdb. The suspect was two Xlib
# threads against an uninitialized Xlib; host-support.h now calls XInitThreads
# at static-init time. This workflow loops the plain test - no gdb, whose
# scheduling hid the crash - so every push gives the fix a dozen chances to
# fail. Remove it once the main jobs have stayed green for a while.

on:
  push:
    branches:
      - volum/linux-port
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  soak:
    name: rig import, plain loop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Download the VST3 SDK
        working-directory: iPlug2/Dependencies/IPlug
        run: bash download-vst3-sdk.sh
        shell: bash

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libx11-dev libgl1-mesa-dev libglu1-mesa-dev libatomic1 libasound2-dev \
            libglib2.0-dev dbus dbus-daemon dbus-bin python3-gi gir1.2-glib-2.0 gdb
        shell: bash

      - name: Build
        run: |
          cmake -S NeuralAmpModeler/linux -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVOLUM_COPY_RIGS=OFF
          cmake --build build/linux
        shell: bash

      - name: Loop the plain import test, catch a stack on failure
        env:
          MALLOC_CHECK_: 3
        run: |
          # The wrapper is a script, not a command string: the test expands
          # VOLUM_PROBE_WRAP unquoted, so embedded quotes would reach gdb intact.
          cat > /tmp/gdbwrap <<'EOF'
          #!/bin/bash
          exec gdb -batch -ex 'set disable-randomization off' -ex run \
            -ex 'echo \n=== STACKS ===\n' -ex 'thread apply all bt' -ex quit --args "$@"
          EOF
          chmod +x /tmp/gdbwrap
          hit=0
          for i in $(seq 1 12); do
            echo "=== iteration $i ==="
            code=0
            out="$(NeuralAmpModeler/linux/test/rig-import-test.bash build/linux 2>&1)" || code=$?
            printf '%s\n' "$out" | tail -12
            if [ "$code" -ne 0 ]; then
              echo "echec a l'iteration $i"
              printf '%s\n' "$out" | tail -60
              hit=1
              break
            fi
          done
          if [ "$hit" -ne 1 ]; then
            echo "12 iterations sans echec"
            exit 0
          fi
          echo "=== reprise sous gdb ==="
          caught=0
          for r in 1 2 3 4 5 6; do
            echo "--- essai gdb $r ---"
            code=0
            out="$(VOLUM_PROBE_WRAP=/tmp/gdbwrap NeuralAmpModeler/linux/test/rig-import-test.bash build/linux 2>&1)" || code=$?
            printf '%s\n' "$out" | tail -160
            if printf '%s\n' "$out" | grep -q '=== STACKS ==='; then
              caught=1
              break
            fi
            [ "$code" -eq 0 ] || break
          done
          [ "$caught" -eq 1 ] || echo "pas de pile sous gdb"
          exit "$code"
        shell: bash
