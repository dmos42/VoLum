name: Linux debug

# One-off diagnosis harness: the rig-import test's phase 3 aborts in the plain
# Release build (glibc: "double free detected in tcache 2") and passes under both
# ASan and gdb, which points at a timing- or layout-dependent teardown bug. This
# workflow reproduces the plain build's crash with core dumps enabled and prints
# the stack of every thread from the core, which is the evidence the CI log lacks.

on:
  push:
    branches:
      - volum/linux-port
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  coredump:
    name: rig import, core dump on abort
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Download the VST3 SDK
        working-directory: iPlug2/Dependencies/IPlug
        run: bash download-vst3-sdk.sh
        shell: bash

      - name: Install build and debug tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb libx11-dev libgl1-mesa-dev libglu1-mesa-dev libatomic1 libasound2-dev \
            libglib2.0-dev dbus dbus-daemon dbus-bin python3-gi gir1.2-glib-2.0 gdb
        shell: bash

      - name: Build
        run: |
          cmake -S NeuralAmpModeler/linux -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVOLUM_COPY_RIGS=OFF
          cmake --build build/linux
        shell: bash

      - name: Run the import test with core dumps on
        run: |
          # The runner VM allows sudo, so the core goes to a known absolute path
          # instead of whatever systemd-coredump would do with it. The abort is
          # intermittent (two red runs, then two green ones on the same commit),
          # so the test is looped until a core exists or the loop is spent.
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          ulimit -c unlimited
          for i in $(seq 1 12); do
            echo "=== iteration $i ==="
            code=0
            out="$(NeuralAmpModeler/linux/test/rig-import-test.bash build/linux 2>&1)" || code=$?
            printf '%s\n' "$out" | tail -12
            if ls /tmp/core.* >/dev/null 2>&1; then
              echo "core obtenu a l'iteration $i"
              break
            fi
            [ "$code" -eq 0 ] || { echo "echec sans core a l'iteration $i"; break; }
          done
          if ls /tmp/core.* >/dev/null 2>&1; then
            core="$(ls -t /tmp/core.* | head -1)"
            gdb -batch \
              -ex 'set pagination off' \
              -ex 'thread apply all bt' \
              build/linux/volum-vst3-probe "$core" 2>&1 | tail -140
            echo "=== modules ==="
            gdb -batch -ex 'info sharedlibrary' build/linux/volum-vst3-probe "$core" 2>&1 | grep -i volum
          else
            echo "aucun core apres la boucle"
          fi
          [ "$code" -eq 0 ] || exit "$code"
        shell: bash
